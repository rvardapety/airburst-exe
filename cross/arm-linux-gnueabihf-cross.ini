[constants]
target_triple = 'arm-linux-gnueabihf'

[binaries]
c       = target_triple + '-gcc'
ar      = target_triple + '-ar'
as      = target_triple + '-as'
objdump = target_triple + '-objdump'
objcopy = target_triple + '-objcopy'
size    = target_triple + '-size'
strip   = target_triple + '-strip'

[built-in options]
c_std = 'c99'
optimization = '3'
debug = true
b_staticpic = true
c_args = [
         '-DTARGET_ARCH_armv7l',
         '-pedantic',
         '-Wall',
         '-Werror',
         '-Wextra',
         '-Wdouble-promotion',
         '-Wstrict-prototypes',
         '-Wcast-qual',
         '-Wmissing-prototypes',
         '-Winit-self',
         '-Wpointer-arith',
         '-Wshadow',
         '-D_GNU_SOURCE']

c_link_args = [
          '-Wl,--gc-sections',
          '-Wl,--wrap=expf',
          '-Wl,--wrap=logf',
          '-Wl,--wrap=powf']

[properties]

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7l'
endian = 'little'
